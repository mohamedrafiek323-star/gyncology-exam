Object.entries(DAYS).forEach(([d,o])=>o.items.forEach((it,i)=>it.id='d'+d+'-'+i));const ls={g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};let dn=ls.g('obs_done',{}),mk=new Set(ls.g('obs_marked',[])),S={tab:'N',f:'all',i:0,hl:ls.g('obs_hl',false),rev:{},pick:{},topics:ls.g('obs_topics',{})};const all=()=>Object.values(DAYS).flatMap(o=>o.items);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function H(t,k){let s=esc(t);if(S.hl&&k)k.forEach(w=>{const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>')});return s}function topics(){return[...new Set(((DAYS[S.tab]||{}).items||[]).map(x=>x.tp))]}function tcount(t){return ((DAYS[S.tab]||{}).items||[]).filter(x=>x.tp===t).length}function list(){let a=(DAYS[S.tab]||{}).items||[];if(S.f==='marked')a=a.filter(x=>mk.has(x.id));else if(S.f==='u')a=a.filter(x=>x.t==='u');else if(S.f==='m')a=a.filter(x=>x.t==='m');else if(S.f==='k')a=a.filter(x=>x.s.startsWith('Kasr'));const sel=S.topics[S.tab]||[];if(sel.length)a=a.filter(x=>sel.includes(x.tp));return a}function tog(w){if(w==='hl'){S.hl=!S.hl;ls.s('obs_hl',S.hl)}else{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;ls.s('obs_theme',n)}draw()}function setTab(t){S.tab=t;S.i=0;draw()}function setF(f){S.f=f;S.i=0;draw()}function go(n){const L=list();S.i=Math.max(0,Math.min(L.length-1,S.i+n));draw()}function jump(i){S.i=i;draw()}function mark(){const it=list()[S.i];if(!it)return;mk.has(it.id)?mk.delete(it.id):mk.add(it.id);ls.s('obs_marked',[...mk]);draw()}function pick(j){const it=list()[S.i];if(S.pick[it.id]==null){S.pick[it.id]=j;S.rev[it.id]=1;dn[it.id]=it.o[j][1]?'c':'w';ls.s('obs_done',dn);draw()}}function rev(){const it=list()[S.i];S.rev[it.id]=!S.rev[it.id];if(S.rev[it.id]&&!dn[it.id]){dn[it.id]='r';ls.s('obs_done',dn)}draw()}function resetP(){if(confirm('Reset?')){dn={};S.rev={};S.pick={};ls.s('obs_done',dn);draw()}}function toggleTopic(t){let cur=S.topics[S.tab]||[];if(cur.includes(t))cur=cur.filter(x=>x!==t);else cur=[...cur,t];S.topics[S.tab]=cur;ls.s('obs_topics',S.topics);S.i=0;draw()}function clearTopics(){S.topics[S.tab]=[];ls.s('obs_topics',S.topics);S.i=0;draw()}function draw(){document.getElementById('tabs').innerHTML=`<button class="on">New MCQs</button>`;const tp=topics(),TP=document.getElementById('topics');if(!tp.length)TP.innerHTML='';else{const cur=S.topics[S.tab]||[];TP.innerHTML=tp.map(t=>`<span class="chip ${cur.includes(t)?'sel':''}" onclick="toggleTopic('${t.replace(/'/g,"\\'")}')">${esc(t)} <span class="cnt">(${tcount(t)})</span></span>`).join('')+`<span class="chip" onclick="clearTopics()" style="border-style:dashed">All topics</span>`}document.getElementById('filt').innerHTML=[['all','All'],['marked','★ Marked'],['u','Flash cards'],['m','MCQ'],['k','Kasr only']].map(([k,l])=>`<button class="${S.f===k?'on':''}" onclick="setF('${k}')">${l}</button>`).join(' ');document.getElementById('bhl').className=S.hl?'on':'';const L=list(),c=document.getElementById('card');if(!L.length){c.innerHTML='<div class="empty">No items.</div>';document.getElementById('cnt').textContent='0 / 0';document.getElementById('dots').innerHTML='';document.getElementById('pv').disabled=document.getElementById('nx').disabled=true;document.getElementById('pgi').style.width='0%';document.getElementById('pgt').textContent='';return}if(S.i>=L.length)S.i=L.length-1;const it=L[S.i],r=S.rev[it.id],m=mk.has(it.id);const bc=it.s.startsWith('Kasr')?'k':'s';let h=`<div class="meta"><span class="b ${bc}">Source: ${esc(it.s)}</span>${dn[it.id]?`<span class="b ${dn[it.id]==='w'?'sw':'sv'}">${dn[it.id]==='c'?'✓ Solved: correct':dn[it.id]==='w'?'✓ Solved: wrong':'✓ Solved'}</span>`:''}<span class="b">${it.t==='u'?'Flash card':'MCQ'}</span><span class="b">${esc(it.tp)}</span><button class="star ${m?'m':''}" onclick="mark()" title="Mark (M)">${m?'★':'☆'}</button></div><div class="q" dir="auto">${H(it.q,it.k)}</div>`;if(it.t==='u'){h+=`<button onclick="rev()">${r?'Hide answer':'Show answer'}</button>`;if(r)h+=`<div class="ans"><ul dir="auto">${it.a.map(x=>'<li>'+esc(x)+'</li>').join('')}${it.x.map(x=>'<li><span class="x">خارج الكتاب</span>'+esc(x)+'</li>').join('')}</ul></div>`}else{const p=S.pick[it.id];h+=it.o.map((o,j)=>{const cls=r?(o[1]?'ok':(p===j?'bad':'')):'';return `<button class="opt ${cls}" onclick="pick(${j})" dir="auto">${String.fromCharCode(65+j)}. ${esc(o[0])}${r?(o[1]?' ✔':(p===j?' ✘':'')):''}${r&&o[2]?`<span class="why">${esc(o[2])}</span>`:''}</button>`}).join('');if(!r)h+='<button onclick="rev()" style="margin-top:6px">Show answer</button>'}h+=`<div class="ref">Reference: ${esc(it.r)}</div>`;c.innerHTML=h;document.getElementById('cnt').textContent=(S.i+1)+' / '+L.length;const n=L.filter(x=>dn[x.id]).length;document.getElementById('pgi').style.width=(100*n/L.length)+'%';document.getElementById('pgt').textContent='Solved '+n+' / '+L.length;document.getElementById('pv').disabled=S.i===0;document.getElementById('nx').disabled=S.i===L.length-1;document.getElementById('dots').innerHTML=L.map((x,i)=>`<button class="${i===S.i?'cur ':''}${mk.has(x.id)?'mk ':''}${dn[x.id]||''}" onclick="jump(${i})">${dn[x.id]?'✓ ':''}${i+1}</button>`).join('')}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='m'||e.key==='M')mark()});document.documentElement.dataset.theme=ls.g('obs_theme',matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');draw();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBS Day 7</title><style>:root{--bg:#f4f6f8;--card:#fff;--tx:#14212b;--mu:#5b6b78;--ln:#d5dde3;--ac:#1f7a8c;--ok:#1b7f4b;--okb:#e2f4ea;--bad:#b3261e;--badb:#fbe6e4;--mk:#fff0b8}[data-theme=dark]{--bg:#0f1519;--card:#18222a;--tx:#e8eef2;--mu:#9bb0bd;--ln:#2c3b46;--ac:#5cc2d4;--ok:#6fd29a;--okb:#16352a;--bad:#ff8a80;--badb:#3a1c1a;--mk:#6b5a14}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}.w{max-width:880px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0 8px}.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}button{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 11px;border-radius:8px;cursor:pointer}button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}.on{background:var(--ac);color:#fff;border-color:var(--ac)}#card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:10px 0}.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:12px}.b{padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.b.s{font-size:13px;font-weight:700;background:var(--ac);color:#fff;border-color:var(--ac)}.b.k{background:#b5651d;border-color:#b5651d;color:#fff}.b.sv{background:var(--okb);color:var(--ok);border-color:var(--ok)}.b.sw{background:var(--badb);color:var(--bad);border-color:var(--bad)}.star{margin-left:auto;font-size:18px;line-height:1;padding:4px 9px}.star.m{background:var(--mk)}.q{font-size:17px;font-weight:600;margin:6px 0 12px}mark{background:#ffd84d;color:#111;border-radius:3px;padding:0 2px}.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 12px}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--badb);border-color:var(--bad)}.why{display:block;font-size:13px;color:var(--mu);margin-top:4px}.ans{border-left:4px solid var(--ok);background:var(--okb);padding:8px 12px;border-radius:6px;margin-top:10px}.ans li{margin:3px 0}.x{font-size:11px;background:var(--mk);color:var(--tx);padding:1px 6px;border-radius:6px;margin-right:4px}.ref{font-size:12px;color:var(--mu);margin-top:10px}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.dots button{padding:2px 7px;font-size:12px}.dots .cur{border-color:var(--ac);outline:2px solid var(--ac)}.dots .mk{background:var(--mk)}.dots .c,.dots .r{background:var(--okb);border-color:var(--ok)}.dots .w{background:var(--badb);border-color:var(--bad)}#pg{height:6px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0}#pg i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}.empty{color:var(--mu);text-align:center;padding:30px 0}.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--ln);background:var(--card);cursor:pointer;user-select:none}.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.chip .cnt{opacity:.7;font-size:11px;margin-left:2px}</style></head><body><div class="w"><h1>OBS Day 7 — Medical Disorders</h1><div class="row" id="tabs"></div><div class="chiprow" id="topics"></div><div class="row"><span id="filt"></span><button id="bhl" onclick="tog('hl')">Highlight keywords</button><button onclick="tog('theme')">Dark / Light</button></div><div id="card"></div><div class="nav"><button id="pv" onclick="go(-1)">&larr; Previous</button><span id="cnt" style="color:var(--mu)"></span><button id="nx" onclick="go(1)">Next &rarr;</button></div><div id="pg"><i id="pgi"></i></div><div class="row" style="justify-content:space-between"><span id="pgt" style="color:var(--mu)"></span><button onclick="resetP()">Reset progress</button></div><div class="dots" id="dots"></div>< Object.entries(DAYS).forEach(([d,o])=>o.items.forEach((it,i)=>it.id='d'+d+'-'+i));const ls={g(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};let dn=ls.g('obs_done',{}),mk=new Set(ls.g('obs_marked',[])),S={tab:'7',f:'all',i:0,hl:ls.g('obs_hl',false),rev:{},pick:{},topics:ls.g('obs_topics',{})};const all=()=>Object.values(DAYS).flatMap(o=>o.items);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function H(t,k){let s=esc(t);if(S.hl&&k)k.forEach(w=>{const e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');s=s.replace(new RegExp('('+e+')','gi'),'<mark>$1</mark>')});return s}function topics(){return[...new Set(((DAYS[S.tab]||{}).items||[]).map(x=>x.tp))]}function tcount(t){return ((DAYS[S.tab]||{}).items||[]).filter(x=>x.tp===t).length}function list(){let a=(DAYS[S.tab]||{}).items||[];if(S.f==='marked')a=a.filter(x=>mk.has(x.id));else if(S.f==='u')a=a.filter(x=>x.t==='u');else if(S.f==='m')a=a.filter(x=>x.t==='m');else if(S.f==='k')a=a.filter(x=>x.s.startsWith('Kasr'));const sel=S.topics[S.tab]||[];if(sel.length)a=a.filter(x=>sel.includes(x.tp));return a}function tog(w){if(w==='hl'){S.hl=!S.hl;ls.s('obs_hl',S.hl)}else{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;ls.s('obs_theme',n)}draw()}function setTab(t){S.tab=t;S.i=0;draw()}function setF(f){S.f=f;S.i=0;draw()}function go(n){const L=list();S.i=Math.max(0,Math.min(L.length-1,S.i+n));draw()}function jump(i){S.i=i;draw()}function mark(){const it=list()[S.i];if(!it)return;mk.has(it.id)?mk.delete(it.id):mk.add(it.id);ls.s('obs_marked',[...mk]);draw()}function pick(j){const it=list()[S.i];if(S.pick[it.id]==null){S.pick[it.id]=j;S.rev[it.id]=1;dn[it.id]=it.o[j][1]?'c':'w';ls.s('obs_done',dn);draw()}}function rev(){const it=list()[S.i];S.rev[it.id]=!S.rev[it.id];if(S.rev[it.id]&&!dn[it.id]){dn[it.id]='r';ls.s('obs_done',dn)}draw()}function resetP(){if(confirm('Reset?')){dn={};S.rev={};S.pick={};ls.s('obs_done',dn);draw()}}function toggleTopic(t){let cur=S.topics[S.tab]||[];if(cur.includes(t))cur=cur.filter(x=>x!==t);else cur=[...cur,t];S.topics[S.tab]=cur;ls.s('obs_topics',S.topics);S.i=0;draw()}function clearTopics(){S.topics[S.tab]=[];ls.s('obs_topics',S.topics);S.i=0;draw()}function draw(){document.getElementById('tabs').innerHTML=`<button class="on">Day 7</button>`;const tp=topics(),TP=document.getElementById('topics');if(!tp.length)TP.innerHTML='';else{const cur=S.topics[S.tab]||[];TP.innerHTML=tp.map(t=>`<span class="chip ${cur.includes(t)?'sel':''}" onclick="toggleTopic('${t.replace(/'/g,"\\'")}')">${esc(t)} <span class="cnt">(${tcount(t)})</span></span>`).join('')+`<span class="chip" onclick="clearTopics()" style="border-style:dashed">All topics</span>`}document.getElementById('filt').innerHTML=[['all','All'],['marked','★ Marked'],['u','Flash cards'],['m','MCQ'],['k','Kasr only']].map(([k,l])=>`<button class="${S.f===k?'on':''}" onclick="setF('${k}')">${l}</button>`).join(' ');document.getElementById('bhl').className=S.hl?'on':'';const L=list(),c=document.getElementById('card');if(!L.length){c.innerHTML='<div class="empty">No items.</div>';document.getElementById('cnt').textContent='0 / 0';document.getElementById('dots').innerHTML='';document.getElementById('pv').disabled=document.getElementById('nx').disabled=true;document.getElementById('pgi').style.width='0%';document.getElementById('pgt').textContent='';return}if(S.i>=L.length)S.i=L.length-1;const it=L[S.i],r=S.rev[it.id],m=mk.has(it.id);const bc=it.s.startsWith('Kasr')?'k':'s';let h=`<div class="meta"><span class="b ${bc}">Source: ${esc(it.s)}</span>${dn[it.id]?`<span class="b ${dn[it.id]==='w'?'sw':'sv'}">${dn[it.id]==='c'?'✓ Solved: correct':dn[it.id]==='w'?'✓ Solved: wrong':'✓ Solved'}</span>`:''}<span class="b">${it.t==='u'?'Flash card':'MCQ'}</span><span class="b">${esc(it.tp)}</span><button class="star ${m?'m':''}" onclick="mark()" title="Mark (M)">${m?'★':'☆'}</button></div><div class="q" dir="auto">${H(it.q,it.k)}</div>`;if(it.t==='u'){h+=`<button onclick="rev()">${r?'Hide answer':'Show answer'}</button>`;if(r)h+=`<div class="ans"><ul dir="auto">${it.a.map(x=>'<li>'+esc(x)+'</li>').join('')}${it.x.map(x=>'<li><span class="x">خارج الكتاب</span>'+esc(x)+'</li>').join('')}</ul></div>`}else{const p=S.pick[it.id];h+=it.o.map((o,j)=>{const cls=r?(o[1]?'ok':(p===j?'bad':'')):'';return `<button class="opt ${cls}" onclick="pick(${j})" dir="auto">${String.fromCharCode(65+j)}. ${esc(o[0])}${r?(o[1]?' ✔':(p===j?' ✘':'')):''}${r&&o[2]?`<span class="why">${esc(o[2])}</span>`:''}</button>`}).join('');if(!r)h+='<button onclick="rev()" style="margin-top:6px">Show answer</button>'}h+=`<div class="ref">Reference: ${esc(it.r)}</div>`;c.innerHTML=h;document.getElementById('cnt').textContent=(S.i+1)+' / '+L.length;const n=L.filter(x=>dn[x.id]).length;document.getElementById('pgi').style.width=(100*n/L.length)+'%';document.getElementById('pgt').textContent='Solved '+n+' / '+L.length;document.getElementById('pv').disabled=S.i===0;document.getElementById('nx').disabled=S.i===L.length-1;document.getElementById('dots').innerHTML=L.map((x,i)=>`<button class="${i===S.i?'cur ':''}${mk.has(x.id)?'mk ':''}${dn[x.id]||''}" onclick="jump(${i})">${dn[x.id]?'✓ ':''}${i+1}</button>`).join('')}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='m'||e.key==='M')mark()});document.documentElement.dataset.theme=ls.g('obs_theme',matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');draw();</script></body></html>
